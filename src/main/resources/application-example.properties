# ===================================================================
# APPLICATION-EXAMPLE.PROPERTIES
# -------------------------------------------------------------------
# This is an example configuration file.
# To run the application, copy this file to 'application.properties'
# and replace the placeholder values with your actual configuration.
# ===================================================================

# ----------------------------------------
# CORE SPRING BOOT CONFIGURATION
# ----------------------------------------
# Application Name
spring.application.name=order-management-system

# Server Configuration
server.port=8080


# ----------------------------------------
# POSTGRESQL DATABASE CONFIGURATION
# ----------------------------------------
# Replace placeholders with your actual database details.
spring.datasource.url=jdbc:postgresql://localhost:5432/meli_order_db
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=org.postgresql.Driver


# ----------------------------------------
# HIKARI CONNECTION POOL CONFIGURATION
# ----------------------------------------
# These are performance settings for the database connection pool.
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10


# ----------------------------------------
# JPA / HIBERNATE CONFIGURATION
# ----------------------------------------
# 'ddl-auto=update' tells Hibernate to automatically create/update tables based on your Entity classes.
# 'show-sql=true' prints the generated SQL queries to the console for debugging.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ----------------------------------------
# LOGGING CONFIGURATION
# ----------------------------------------
# Controls the verbosity of logs.
logging.level.root=INFO
logging.level.com.meli.ordermanagementsystem=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n