# ========================================
# MELI Order Management System
# Shared Configuration (All Profiles)
# ========================================

# Application Name
spring.application.name=order-management-system

# Default Profile - REMOVED for explicit control
# Profile MUST be specified when running:
# Development: -Dspring.profiles.active=dev
# Testing: -Dspring.profiles.active=test
# Production: -Dspring.profiles.active=prod

# ========================================
# Server Configuration (Can be overridden by profiles)
# ========================================
server.port=8080
server.servlet.context-path=/

# ========================================
# Jackson Configuration (JSON Serialization)
# ========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Mexico_City
spring.jackson.default-property-inclusion=non_null

# ========================================
# JPA Common Configuration
# ========================================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# ========================================
# Logging Common Configuration
# ========================================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ========================================
# Spring Boot Actuator, for monitoring
# ========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ========================================
# Swagger/OpenAPI Configuration
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.packages-to-scan=com.meli.ordermanagementsystem.controller
springdoc.show-actuator=false