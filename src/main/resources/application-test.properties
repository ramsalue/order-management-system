# ========================================
# MELI Order Management System
# Testing Profile Configuration
# ========================================
# This profile is used for automated testing
# Optimized for fast, isolated test execution
# ========================================

# ========================================
# Server Configuration
# ========================================
server.port=8081
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# ========================================
# PostgreSQL Test Database Configuration
# ========================================
# Separate test database to avoid conflicts
spring.datasource.url=jdbc:postgresql://localhost:5432/meli_order_db_test
spring.datasource.username=${DB_TEST_USERNAME:meli_test_user}
spring.datasource.password=${DB_TEST_PASSWORD:'your_test_password'}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# HikariCP Connection Pool Configuration
# ========================================
# Minimal pool for testing
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=false

# ========================================
# JPA/Hibernate Configuration
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.generate_statistics=false

# IMPORTANT: Force DDL generation
spring.jpa.generate-ddl=true
spring.jpa.defer-datasource-initialization=false

# Enable schema generation logs
logging.level.org.hibernate.tool.hbm2ddl=DEBUG
#logging.level.org.hibernate.SQL=DEBUG

# Cache settings (disabled for testing)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# ========================================
# Transaction Configuration
# ========================================
# Ensure transaction rollback for tests
spring.jpa.properties.hibernate.connection.autocommit=false
spring.test.database.replace=none

# ========================================
# Logging Configuration
# ========================================
# Moderate logging for tests
logging.level.root=INFO
logging.level.com.meli.ordermanagementsystem=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.springframework.test=DEBUG

# Log file configuration
logging.file.name=logs/test/application-test.log
logging.file.max-size=5MB
logging.file.max-history=5

# ========================================
# Spring DevTools Configuration
# ========================================
# Disable DevTools in testing
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ========================================
# Testing Specific Settings
# ========================================
# Disable CORS for testing
spring.web.cors.enabled=false

# ========================================
# Actuator Configuration
# ========================================
# Limited endpoints for testing
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ========================================
# Banner Configuration
# ========================================
spring.banner.location=classpath:banner-test.txt

# ========================================
# Application Custom Properties
# ========================================
app.name=MELI Order Management System
app.version=1.0.0
app.environment=testing

# CORS Configuration
app.cors.enabled=false