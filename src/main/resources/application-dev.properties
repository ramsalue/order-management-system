# ========================================
# MELI Order Management System
# Development Profile Configuration
# ========================================
# This profile is used for local development
# ========================================

# ========================================
# Server Configuration
# ========================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# ========================================
# PostgreSQL Database Configuration
# ========================================
# Local development database
spring.datasource.url=jdbc:postgresql://localhost:5432/meli_order_db
# The following lines are an important feature:
# "Try to find an environment variable named DB_USERNAME.
# If it can't find it, uses the default value meli_user."
spring.datasource.username=${DB_USERNAME:meli_user}
spring.datasource.password=${DB_PASSWORD:meli_password_2025}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# HikariCP Connection Pool Configuration
# ========================================
# Smaller pool for local development
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1

# ========================================
# JPA/Hibernate Configuration
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.generate_statistics=false

# ========================================
# Logging Configuration
# ========================================
# Detailed logging for development
logging.level.root=INFO
logging.level.com.meli.ordermanagementsystem=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc.core=DEBUG

# Log file configuration
logging.file.name=logs/dev/application-dev.log
logging.file.max-size=10MB
logging.file.max-history=10

# ========================================
# Spring DevTools Configuration
# ========================================
# Enable automatic restart on code changes
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ========================================
# Development Specific Settings
# ========================================
# Allow CORS for frontend development
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ========================================
# H2 Console (Optional - for quick database viewing)
# ========================================
# Uncomment if it's going to be used H2 console alongside PostgreSQL
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ========================================
# Actuator Configuration
# ========================================
# Expose all endpoints for debugging
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ========================================
# Banner Configuration
# ========================================
spring.banner.location=classpath:banner-dev.txt

# ========================================
# Application Custom Properties
# ========================================
app.name=MELI Order Management System
app.version=1.0.0
app.environment=development

# CORS Configuration
app.cors.enabled=true
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# ========================================
# Swagger Configuration for Development
# ========================================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
logging.level.org.springdoc=DEBUG