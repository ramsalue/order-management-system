# ========================================
# Test Configuration
# ========================================
spring.profiles.active=test
spring.application.name=order-management-system
server.port=8081

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/meli_order_db_test
spring.datasource.username=meli_test_user
spring.datasource.password='your_test_password'
spring.datasource.driver-class-name=org.postgresql.Driver

# Force DDL creation - CRITICAL for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Test context cache
spring.test.context.cache.maxSize=10